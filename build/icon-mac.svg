      <stop offset="0" stop-color="#6ad80f"/>
      <stop offset="1" stop-color="#52c000"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- 底部立体厚边 -->
  <rect y="930" width="1024" height="94" fill="#58a700"/>
  <rect y="918" width="1024" height="16" fill="#4c9a00" opacity=".35"/>
