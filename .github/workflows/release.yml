name: Build release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            executable: release/mac-arm64/DocDiff.app/Contents/MacOS/DocDiff
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: release/mac/DocDiff.app/Contents/MacOS/DocDiff
          - os: windows-latest
            platform: win
            arch: x64
            executable: release/win-unpacked/DocDiff.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/smoke-release.mjs "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error
